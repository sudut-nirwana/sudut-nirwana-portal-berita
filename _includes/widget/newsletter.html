<div class="widget widget-newsletter widget-sticky">
  <h3 class="widget-title">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
    Newsletter
  </h3>
  <p class="newsletter-desc">Dapatkan update artikel pilihan, mulai dari gaya hidup, jurnal, hingga wawasan menarik lainnya langsung di kotak masuk Anda.</p>
  
  <!-- Form Berlangganan -->
  <form id="sidebarNewsletterForm" class="newsletter-form">
    <input type="email" id="sidebarEmail" placeholder="Email kamu..." required class="newsletter-input">
    <button type="submit" class="newsletter-btn">Berlangganan</button>
  </form>

  <!-- Form Berhenti Berlangganan (Hidden Awalnya) -->
  <form id="sidebarUnsubscribeForm" class="newsletter-form" style="display: none;">
    <input type="email" id="sidebarUnsubscribeEmail" placeholder="Email untuk berhenti..." required class="newsletter-input">
    <button type="submit" class="newsletter-btn-danger">Berhenti Berlangganan</button>
  </form>

  <p id="newsletterMsg" style="font-size: 12px; margin-top: 6px; display: none;"></p>
  
  <div style="margin-top: 8px; text-align: right;">
    <a href="#" id="toggleUnsubscribe" style="font-size: 11px; color: var(--text-muted); text-decoration: underline;">Ingin berhenti berlangganan?</a>
  </div>
</div>

<!-- Pemanggil Script Terpisah -->
<script src="/assets/js/newsletter.js"></script>
